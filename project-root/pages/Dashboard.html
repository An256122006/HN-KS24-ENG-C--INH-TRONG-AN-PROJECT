<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trello-V2</title>
    <link rel="stylesheet" href="/project-root/css/Dashboard.css">
    <link rel="icon" href="/project-root/addset/img/icon1.png" type="image/png">
    <script src="https://kit.fontawesome.com/0c1f5dacbd.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Epilogue:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Manrope:wght@200..800&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
    <div class="all">
        <div id="head">
            <div class="img"><img src="/project-root/addset/img/trello-logo-full.png.png" alt=""></div>
            <div id="content">
                <div class="list1">
                    <p>Your workspaces</p>
                    <div id="boardbtn"><i class="fa-solid fa-list"></i> Boards</div>
                    <div><i class="fa-regular fa-star"></i> Starred Boards</div>
                    <div id="close"><i class="fa-regular fa-rectangle-xmark"></i> Closed Boards</div>
                </div>
                <div class="list2">
                    <div><i class="fa-solid fa-gear"></i> setting</div>
                    <div id="sign-out"><i class="fa-solid fa-door-closed"></i> sign-out</div>
                </div>
            </div>
        </div>
        <div id="body">
            <div class="pass1">
                <div class="search"><img src="/project-root/addset/img/trello-logo-full.png.png" alt=""></div>
                <div class="search">
                    <div id="search"><i class="fa-solid fa-magnifying-glass"></i></div>
                    <div id="list"><i class="fa-solid fa-list"></i></div>
                </div>
            </div>
            <div class="pass2">
                <div class="row1">
                    <div class="i"><i class="fa-solid fa-list"></i></div> <span>Your workspaces</span>
                </div>
                <div class="buttonall">
                    <div><button class="button" id="share">Share</button>
                        <button class="button" id="Export">Export</button>
                    </div>
                    <button class="button dropdown"><i class="fa-solid fa-calendar-days"></i> This Week</button>
                </div>
            </div>
            <div id="pass1">
                <div id="up">

                </div>
                <div id="create">
                    <button id="btn">Create new board</button>
                </div>
            </div>
            <div class="pass2">
                <div class="row1">
                    <div class="i"><i class="fa-regular fa-star"></i></div> <span>Starred Boards</span>
                </div>
            </div>
            <div id="pass1-b">
                <div id="up2">

                </div>
            </div>
        </div>
    </div>
    <div id="createboard">
        <div class="head-createboard">
            <div>Create board</div>
            <button id="x">x</button>
        </div>
        <div class="body-createboard">
            <div class="textboard">Background</div>
            <div id="background">

            </div>
            <hr>
            <div class="textboard">Color</div>
            <div id="color">

            </div>
            <hr>
            <div class="textboard"><label for="text">Board title ❗</label></div>
            <input type="text" id="text" placeholder="E.g. Shopping list for birthday...">
            <div>👋 Please provide a valid board title.</div>
            <hr>
        </div>
        <div class="footer-createboard">
            <button id="closeboard">close</button>
            <button id="saveboard">save</button>
        </div>
    </div>
    <div id="repairboard">
        <div class="head-repairboard">
            <div>Repair board</div>
            <button id="x2">x</button>
        </div>
        <div class="body-repairboard">
            <div class="textboard">Background</div>
            <div id="background2">

            </div>

            <hr>
            <div class="textboard">Color</div>
            <div id="color2">

            </div>
            <hr>
            <div class="textboard"><label for="text">Board title ❗</label></div>
            <input type="text" id="text2" placeholder="E.g. Shopping list for birthday...">
            <div>👋 Please provide a valid board title.</div>
            <hr>
        </div>
        <div class="footer-repairboard">
            <button id="closeboard2">deletes</button>
            <button id="saveboard2">save</button>
        </div>
    </div>
    <div id="deleteConfirmModal" class="modal">
        <div class="modal-content">
            <p>Bạn có chắc chắn muốn xóa không?</p>
            <div class="modal-buttons">
                <button class="btn btn-cancel" onclick="closeDeleteModal()">Hủy</button>
                <button class="btn btn-confirm" onclick="confirmDelete()">Xác nhận</button>
            </div>
        </div>
    </div>
    <script src="/project-root/js/Dashboard.js"></script>
</body>
</html>
